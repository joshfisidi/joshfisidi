<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Josh Fisidi</title>
<meta name="description" content="Music, apps, games and code by Josh Fisidi.">
<meta name="theme-color" content="#060304">
<link rel="canonical" href="https://joshfisidi.com/">
<meta property="og:title" content="Josh Fisidi">
<meta property="og:description" content="Music, apps, games and code.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://joshfisidi.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23060304'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23c41e2c' stroke-width='3'/%3E%3C/svg%3E">
<style>
/* A fixed perimeter field behind a small, centred portal. */
:root {
  --bg: #060304;
  --ink: #eceef5;
  --ink-hi: #ffffff;
  --ink-dim: rgba(236, 238, 245, 0.66);
  --line: rgba(236, 238, 245, 0.16);
  --a: #3a060d;   /* oxblood depth */
  --b: #c41e2c;   /* crimson filament */
  --c: #7d0c1a;   /* deep red */
  --display: "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--display);
  -webkit-font-smoothing: antialiased;
}

.sr {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* layer 0: static backdrop, visible before WebGL and whenever it fails */
.backdrop {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 56% at 50% 50%, var(--bg) 58%, transparent 100%),
    conic-gradient(from 200deg at 50% 50%,
      color-mix(in oklab, var(--a) 70%, var(--bg)),
      color-mix(in oklab, var(--c) 45%, var(--bg)),
      color-mix(in oklab, var(--a) 70%, var(--bg)),
      color-mix(in oklab, var(--b) 40%, var(--bg)),
      color-mix(in oklab, var(--a) 70%, var(--bg)));
}
.backdrop::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.5) 100%);
}

/* layer 1: wormhole canvas */
#field {
  position: fixed; inset: 0; z-index: 1;
  display: block; width: 100%; height: 100%;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.9s ease-out;
}
#field.is-live { opacity: 1; }

/* layer 10: interface */
.stage {
  position: relative; z-index: 10;
  box-sizing: border-box;
  min-height: calc(100svh - 52px - max(12px, env(safe-area-inset-bottom, 0px)));
  display: grid; place-items: center;
  padding-block: clamp(40px, 9svh, 96px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage > * { grid-area: 1 / 1; min-width: 0; }
.portal-shell {
  display: grid;
  justify-items: center;
  gap: clamp(20px, 4svh, 36px);
  width: min(100%, 960px);
  text-align: center;
}
.identity h1 {
  margin: 0 0 8px;
  font: 500 12px/1.5 var(--mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.identity p {
  margin: 0;
  color: var(--ink-dim);
  font-size: 13px;
  line-height: 1.7;
  text-wrap: balance;
}

.portal-list {
  list-style: none; margin: 0; padding: 0;
  display: grid; justify-items: center; text-align: center;
  gap: clamp(0px, 0.7svh, 8px);
}
.portal-list > li { display: grid; justify-items: center; }
/* viewport-only sizing: the longest label (MUSIC/GAMES) always fits inside the fixed 14vmin opening */
.portal-heading {
  margin: 0;
  padding-left: 0.06em;   /* balances trailing letter-spacing so centring is optical, not off by one glyph gap */
  font-size: clamp(1.5rem, min(7.2vw - 0.3rem, 7.5svh), 5rem);
  font-weight: 500;
  font-stretch: 112%;
  line-height: 1.05;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}
.portal-link {
  display: inline-flex; align-items: center;
  min-height: 44px;
  color: var(--ink);
  text-decoration: none;
  transition: color 0.15s, text-shadow 0.25s;
}
.portal-link:is(:hover, :focus-visible) {
  color: var(--ink-hi);
  text-shadow: 0 0 0.55em color-mix(in oklab, var(--b) 50%, transparent);
}
a:focus-visible { outline: 2px solid var(--b); outline-offset: 6px; border-radius: 2px; }
.portal-divider {
  display: block;
  font-size: clamp(1.5rem, 0.6rem + min(3vw, 3.5svh), 2.75rem);
  font-weight: 400;
  line-height: 1;
  color: var(--ink-dim);
  padding-block: 0.1em 0.05em;
}

.featured {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  column-gap: 8px;
  min-height: 44px;
  font: 400 11px/1.8 var(--mono);
  color: var(--ink-dim);
  text-decoration: none;
}
.featured-name { color: var(--ink); }
.featured-arrow { color: var(--ink-dim); }
.featured:is(:hover, :focus-visible) .featured-name {
  color: var(--ink-hi);
  text-decoration: underline;
  text-underline-offset: 4px;
}
.site-foot {
  position: relative;
  z-index: 10;
  box-sizing: border-box;
  display: flex;
  justify-content: flex-end;
  padding: 8px max(20px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px));
}
.contact-link {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  font: 400 11px/1.5 var(--mono);
  color: var(--ink-dim);
  text-decoration: none;
}
.contact-link:is(:hover, :focus-visible) { color: var(--ink-hi); }
@media (min-width: 700px) and (max-height: 540px) {
  .stage { padding-block: 24px; }
  .portal-shell {
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    column-gap: clamp(24px, 5vw, 64px);
  }
  .identity { justify-self: end; text-align: left; max-width: 200px; }
  .featured { justify-self: start; justify-content: flex-start; max-width: 180px; }
}
@media (prefers-reduced-motion: reduce) {
  #field, .portal-link { transition: none; }
}
.readout { display: none; }
</style>
<script src="/portal.js?v=2" defer></script>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<canvas id="field" aria-hidden="true"></canvas>

<main class="stage">
  <div class="portal-shell">
  <header class="identity">
    <h1>Josh Fisidi</h1>
    <p>Building software, making music.</p>
  </header>
  <nav id="portal" aria-label="Explore">
    <ul class="portal-list">
      <li><h2 class="portal-heading"><a class="portal-link" href="https://yashguma.com">MUSIC</a></h2></li>
      <li><h2 class="portal-heading"><a class="portal-link" href="https://fisidi.com/apps">APPS</a></h2></li>
      <li><h2 class="portal-heading"><a class="portal-link" href="https://fisidi.com/games">GAMES</a></h2></li>
      <li><h2 class="portal-heading"><a class="portal-link" href="https://github.com/joshfisidi">CODE</a></h2></li>
      <li>
        <span class="portal-divider" aria-hidden="true">-</span>
        <h2 class="portal-heading"><a class="portal-link" href="https://x.com/joshfisidi">X</a></h2>
      </li>
    </ul>
  </nav>
  <a class="featured" href="https://luminoise.app">
    <span>Currently building</span>
    <span class="featured-name">Luminoise <span class="featured-arrow" aria-hidden="true">↗</span></span>
  </a>
  </div>
</main>

<footer class="site-foot">
  <a class="contact-link" href="mailto:josh@fisidi.com">Get in touch <span aria-hidden="true">&nbsp;↗</span></a>
</footer>

<p id="readout" class="readout" hidden></p>

</body>
</html>
