<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Josh Fisidi</title>
<meta name="description" content="Music, apps, games and code by Josh Fisidi.">
<meta name="theme-color" content="#060304">
<link rel="canonical" href="https://joshfisidi.com/">
<meta property="og:title" content="Josh Fisidi">
<meta property="og:description" content="Music, apps, games and code.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://joshfisidi.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23060304'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23c41e2c' stroke-width='3'/%3E%3C/svg%3E">
<style>
/* A fixed perimeter field behind a small, centred portal. */
:root {
  --bg: #060304;
  --ink: #eceef5;
  --ink-hi: #ffffff;
  --ink-dim: rgba(236, 238, 245, 0.66);
  --line: rgba(236, 238, 245, 0.16);
  --a: #3a060d;   /* oxblood depth */
  --b: #c41e2c;   /* crimson filament */
  --c: #7d0c1a;   /* deep red */
  --display: "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--display);
  -webkit-font-smoothing: antialiased;
}

.sr {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* layer 0: static backdrop, visible before WebGL and whenever it fails */
.backdrop {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 56% at 50% 50%, var(--bg) 58%, transparent 100%),
    conic-gradient(from 200deg at 50% 50%,
      color-mix(in oklab, var(--a) 70%, var(--bg)),
      color-mix(in oklab, var(--c) 45%, var(--bg)),
      color-mix(in oklab, var(--a) 70%, var(--bg)),
      color-mix(in oklab, var(--b) 40%, var(--bg)),
      color-mix(in oklab, var(--a) 70%, var(--bg)));
}
.backdrop::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.5) 100%);
}

/* layer 1: wormhole canvas */
#field {
  position: fixed; inset: 0; z-index: 1;
  display: block; width: 100%; height: 100%;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.9s ease-out;
}
#field.is-live { opacity: 1; }

/* layer 10: interface */
.stage {
  position: relative; z-index: 10;
  box-sizing: border-box;
  min-height: calc(100svh - 52px - max(12px, env(safe-area-inset-bottom, 0px)));
  display: grid; place-items: center;
  padding-block: clamp(40px, 9svh, 96px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage > * { grid-area: 1 / 1; min-width: 0; }
.portal-shell {
  display: grid;
  justify-items: center;
  gap: clamp(20px, 4svh, 36px);
  width: min(100%, 960px);
  text-align: center;
}

.portal-list {
  list-style: none; margin: 0; padding: 0;
  display: grid; justify-items: center; text-align: center;
  gap: clamp(0px, 0.7svh, 8px);
}
.portal-list > li { display: grid; justify-items: center; }
/* viewport-only sizing: the longest label (MUSIC/GAMES) always fits inside the fixed 14vmin opening */
.portal-heading {
  margin: 0;
  padding-left: 0.06em;   /* balances trailing letter-spacing so centring is optical, not off by one glyph gap */
  font-size: clamp(1.5rem, min(7.2vw - 0.3rem, 7.5svh), 5rem);
  font-weight: 500;
  font-stretch: 112%;
  line-height: 1.05;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}
.portal-link {
  display: inline-flex; align-items: center;
  min-height: 44px;
  color: var(--ink);
  text-decoration: none;
  transition: color 0.15s, text-shadow 0.25s;
}
.portal-link:is(:hover, :focus-visible) {
  color: var(--ink-hi);
  text-shadow: 0 0 0.55em color-mix(in oklab, var(--b) 50%, transparent);
}
a:focus-visible { outline: 2px solid var(--b); outline-offset: 6px; border-radius: 2px; }

.site-foot {
  position: relative;
  z-index: 10;
  box-sizing: border-box;
  display: flex;
  justify-content: flex-end;
  padding: 8px max(20px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px));
}
.contact-link {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  font: 400 11px/1.5 var(--mono);
  color: var(--ink-dim);
  text-decoration: none;
}
.contact-link:is(:hover, :focus-visible) { color: var(--ink-hi); }
.portrait-gallery, .desktop-bio { display: none; }
@media (min-width: 1200px) and (min-height: 650px) {
  .portal-shell {
    width: min(84vw, 1600px);
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    column-gap: clamp(56px, 6vw, 112px);
  }
  .portrait-gallery {
    display: block;
    position: fixed;
    inset: 14vmin 55vw 14vmin 14vmin;
    pointer-events: none;
    opacity: 0.52;
  }
  .portrait-halo, .portrait-frame, .portrait-layer { position: absolute; inset: 0; }
  .portrait-frame {
    mask-image: radial-gradient(ellipse 60% 55% at 43% 38%, #000 24%, #000d 48%, transparent 86%);
  }
  .portrait-frame img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 52% 24%;
    transform: scale(1.45);
    transform-origin: 52% 24%;
  }
  #portal { position: relative; grid-column: 2; }
  .desktop-bio {
    display: block;
    grid-column: 3;
    width: 100%;
    max-width: 320px;
    justify-self: start;
    text-align: left;
  }
  .desktop-bio p { margin: 0; font-size: 16px; line-height: 1.65; color: var(--ink-dim); }
}
@media (max-width: 767px), (max-width: 950px) and (pointer: coarse) {
  .portrait-gallery {
    display: block;
    position: fixed;
    inset: 14vmin;
    pointer-events: none;
    opacity: 0.3;
  }
  .portrait-halo, .portrait-frame, .portrait-layer { position: absolute; inset: 0; }
  .portrait-frame {
    mask-image: radial-gradient(ellipse 55% 56% at center, #000 28%, #000c 56%, transparent 90%);
  }
  .portrait-layer { isolation: isolate; }
  .portrait-layer img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: grayscale(0.72) contrast(1.12);
  }
  .portrait-layer::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(150deg, #584a9e, #8e234e 62%, #a34b31);
    mix-blend-mode: color;
    opacity: 0.65;
  }
  #portal { position: relative; }
  .portal-link { text-shadow: 0 1px 8px #060304; }
}
@media (prefers-reduced-motion: reduce) {
  #field, .portal-link { transition: none; }
}
.readout { display: none; }
</style>
<script src="/portal.js?v=2" defer></script>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<canvas id="field" aria-hidden="true"></canvas>

<main class="stage">
  <div class="portal-shell">
  <section class="portrait-gallery" aria-label="Portrait" data-source="https://cufummffmtitwhfisrlw.supabase.co/storage/v1/object/public/joshfisidi">
    <div class="portrait-halo"><div class="portrait-frame"></div></div>
  </section>
  <nav id="portal" aria-label="Explore">
    <ul class="portal-list">
      <li><h2 class="portal-heading"><a class="portal-link" href="https://yashguma.com">MUSIC</a></h2></li>
      <li><h2 class="portal-heading"><a class="portal-link" href="https://fisidi.com/apps">APPS</a></h2></li>
      <li><h2 class="portal-heading"><a class="portal-link" href="https://fisidi.com/games">GAMES</a></h2></li>
      <li><h2 class="portal-heading"><a class="portal-link" href="https://github.com/joshfisidi">CODE</a></h2></li>
      <li>
        <h2 class="portal-heading"><a id="social-link" class="portal-link" href="https://x.com/joshfisidi">X</a></h2>
      </li>
    </ul>
  </nav>
  <div class="desktop-bio">
    <p>I build apps and study epigenetics.</p>
  </div>
  </div>
</main>

<footer class="site-foot">
  <a class="contact-link" href="mailto:josh@fisidi.com">Get in touch <span aria-hidden="true">&nbsp;↗</span></a>
</footer>

<p id="readout" class="readout" hidden></p>

<script type="module">
  const source = new URLSearchParams(location.search).get('utm_source')?.trim().toLowerCase();
  const referrer = document.referrer ? new URL(document.referrer).hostname : '';
  const fromInstagram = /(^|\.)instagram\.com$/.test(referrer);
  const fromX = /(^|\.)(x\.com|twitter\.com|t\.co)$/.test(referrer);
  if (fromX || (!fromInstagram && ['x', 'twitter', 't.co'].includes(source))) {
    const social = document.getElementById('social-link');
    social.href = 'https://instagram.com/joshfisidi';
    social.textContent = 'IG';
  }

  const galleryViewport = matchMedia('(min-width: 1200px) and (min-height: 650px), (max-width: 767px), (max-width: 950px) and (pointer: coarse)');
  const loadGallery = () => { if (galleryViewport.matches) import('/gallery.js?v=5'); };
  if (document.readyState === 'complete') loadGallery();
  else window.addEventListener('load', loadGallery, { once: true });
  galleryViewport.addEventListener('change', loadGallery);
</script>
</body>
</html>
